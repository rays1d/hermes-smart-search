name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Result-mapping tests (no network, no keys)
        run: python -m unittest discover -s tests -v

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.yaml parses
        run: |
          python - <<'PY'
          import pathlib, sys
          text = pathlib.Path("plugin.yaml").read_text(encoding="utf-8")
          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML missing")
          data = yaml.safe_load(text)
          assert data.get("kind") == "backend", data
          assert "smartsearch" in (data.get("provides_web_providers") or []), data
          print("ok:", data["name"], data["version"])
          PY
